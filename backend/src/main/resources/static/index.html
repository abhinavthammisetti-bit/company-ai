<!DOCTYPE html>
<html>
<head>
    <title>Company AI Assistant</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:40px;
        }

        .container{
            width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px lightgray;
        }

        h1{
            text-align:center;
            color:#0b5ed7;
        }

        label{
            font-weight:bold;
        }

        input,select{
            width:100%;
            padding:10px;
            margin-top:8px;
            margin-bottom:20px;
            font-size:16px;
        }

        button{

            width:100%;
            padding:12px;
            background:#0b5ed7;
            color:white;
            border:none;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{

            background:#084298;
        }

        #answer{

            margin-top:30px;
            padding:20px;
            background:#eef5ff;
            border-radius:8px;
            min-height:50px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Company AI Assistant</h1>

    <label>Select Company</label>

    <select id="company">

        <option>TCS</option>

    </select>

    <label>Ask Question</label>

    <input
            type="text"
            id="question"
            placeholder="Ask anything about the company...">

    <button onclick="askAI()">
        Ask
    </button>

    <div id="answer">

        Answer will appear here...

    </div>

</div>

<script>

async function askAI(){

    const company=document.getElementById("company").value;

    const question=document.getElementById("question").value;

    const response=await fetch("http://localhost:8080/api/chat/ask",{

        method:"POST",

        headers:{

            "Content-Type":"application/json"

        },

        body:JSON.stringify({

            companyName:company,

            question:question

        })

    });

    const answer=await response.text();

    document.getElementById("answer").innerHTML=answer;

}

</script>

</body>
</html>
