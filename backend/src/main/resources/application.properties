spring.application.name=company-ai

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

nvidia.api.key=${NVIDIA_API_KEY}
nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.model=nvidia/llama-3.3-nemotron-super-49b-v1.5

nvidia.embedding.url=https://integrate.api.nvidia.com/v1/embeddings
nvidia.embedding.model=nvidia/nemotron-3-embed-1b