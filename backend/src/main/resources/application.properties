spring.application.name=company-ai

spring.datasource.url=jdbc:mysql://localhost:3306/company_ai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

nvidia.api.key=${NVIDIA_API_KEY}
nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.model=meta/llama-3.1-8b-instruct

nvidia.embedding.url=https://integrate.api.nvidia.com/v1/embeddings
nvidia.embedding.model=nvidia/nv-embedqa-e5-v5